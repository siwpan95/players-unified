[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "music-player"
version = "0.1.0"
description = "Python 音乐播放器 — tkinter + python-vlc，全格式播放 / 真实 seek / 歌词 / 可视化 / 拖放 / 电台 HLS"
authors = [{ name = "siwpan" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-vlc>=3.0.21203",
    "mutagen>=1.47",
    "numpy>=2.1",
    "Pillow>=10",
]

[project.optional-dependencies]
viz = ["librosa>=0.11", "scipy>=1.13"]
packaging = ["pyinstaller>=6.11", "imageio-ffmpeg"]

[project.scripts]
music-player = "music_player.__main__:main"

[tool.setuptools.packages.find]
include = ["music_player*"]

[tool.pytest.ini_options]
testpaths = ["music_player/tests"]
markers = [
    "network: requires network access (e.g. HLS test streams)",
]
